name: kaku
description: "Budget Application"
publish_to: 'none'
version: 1.0.2+4

environment:
  sdk: ^3.11.5

dependencies:
  archive: ^4.0.9
  confetti: ^0.8.0
  crypto: ^3.0.7
  drift: ^2.33.0
  emoji_picker_flutter: ^4.4.0
  encrypt: ^5.0.3
  file_picker: ^11.0.2
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_colorpicker: ^1.1.0
  flutter_dotenv: ^6.0.1
  flutter_local_notifications: ^21.0.0
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.1
  flutter_slidable: ^4.0.3
  go_router: ^17.2.3
  google_sign_in: ^7.2.0
  googleapis: ^16.0.0
  http: ^1.6.0
  image_picker: ^1.2.2
  intl: ^0.20.2
  local_auth: ^3.0.1
  path: ^1.9.1
  path_provider: ^2.1.5
  pdf: ^3.12.0
  permission_handler: ^12.0.1
  printing: ^5.14.3
  purchases_flutter: ^10.2.2
  riverpod: ^3.2.1
  rxdart: ^0.28.0
  share_plus: ^12.0.2
  shared_preferences: ^2.5.5
  upgrader: ^13.6.0

dev_dependencies:
  build_runner: ^2.15.0
  drift_dev: ^2.33.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: 2.4.7
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/icon/
    - assets/splash/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png" # PNG 1024x1024
  min_sdk_android: 21
  adaptive_icon_background: "#0d1117" # color de fondo del ícono adaptativo
  adaptive_icon_foreground: "assets/icon/icon_foreground.png" # solo el logo sin fondo

flutter_native_splash:
  # Color de fondo — igual al fondo del ícono
  color:      "#0d1117"
  color_dark: "#0d1117"

  # Logo centrado sobre el fondo
  image:      assets/splash/splash.png
  image_dark: assets/splash/splash.png

  # Tamaño del logo en la pantalla (porcentaje del ancho)
  # 30% da un logo ni muy grande ni muy pequeño
  android_gravity:       center
  ios_content_mode:      center

  # Android 12+ tiene su propio splash con ícono adaptativo
  android_12:
    image:                 assets/splash/splash.png
    icon_background_color: "#0d1117"
    color:                 "#0d1117"
    color_dark:            "#0d1117"

  # Pantalla completa sin barra de estado
  fullscreen: true